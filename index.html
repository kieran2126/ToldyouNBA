
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Pronostic NBA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #aab5c5;
  margin-bottom: 28px;
}

.conferences {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  max-width: 1100px;
  margin: auto;
}

.conference {
  background: #1c293b;
  border-radius: 14px;
  padding: 16px;
}

.conference h2 {
  text-align: center;
  padding: 13px;
  margin: 0 0 16px;
  border-radius: 9px;
}

.east h2 {
  background: #1769aa;
}

.west h2 {
  background: #c43d43;
}

.team {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #29384d;
  margin-bottom: 8px;
  padding: 10px;
  border-radius: 8px;
  cursor: grab;
  user-select: none;
}

.team.dragging {
  opacity: 0.35;
}

.position {
  width: 27px;
  color: #aab5c5;
  font-weight: bold;
  text-align: center;
}

.team-name {
  flex: 1;
  font-weight: bold;
  font-size: 14px;
}

.handle {
  color: #8b9bb0;
  font-size: 19px;
}

.move {
  display: flex;
  gap: 4px;
}

.move button {
  border: 0;
  border-radius: 5px;
  background: #43546c;
  color: white;
  padding: 5px 9px;
  cursor: pointer;
  font-size: 16px;
}

.move button:hover {
  background: #607794;
}

.actions {
  text-align: center;
  margin: 25px 0;
}

.actions button {
  padding: 11px 17px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#reset {
  background: #43546c;
  color: white;
}

#export {
  background: #16845d;
  color: white;
}

@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  .conferences {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .team {
    padding: 9px;
  }
}
</style>
</head>

<body>

<h1>🏀 Mon Pronostic NBA</h1>
<p class="subtitle">Classe les 30 équipes comme tu le souhaites</p>

<div class="conferences">

  <section class="conference east">
    <h2>CONFÉRENCE EST</h2>
    <div id="east-list"></div>
  </section>

  <section class="conference west">
    <h2>CONFÉRENCE OUEST</h2>
    <div id="west-list"></div>
  </section>

</div>

<div class="actions">
  <button id="reset">Réinitialiser</button>
  <button id="export">Exporter mes pronostics</button>
</div>

<script>
const initialEast = [
  "Boston Celtics",
  "New York Knicks",
  "Milwaukee Bucks",
  "Cleveland Cavaliers",
  "Indiana Pacers",
  "Philadelphia 76ers",
  "Miami Heat",
  "Orlando Magic",
  "Atlanta Hawks",
  "Chicago Bulls",
  "Brooklyn Nets",
  "Toronto Raptors",
  "Charlotte Hornets",
  "Washington Wizards",
  "Detroit Pistons"
];

const initialWest = [
  "Oklahoma City Thunder",
  "Denver Nuggets",
  "Minnesota Timberwolves",
  "Dallas Mavericks",
  "Phoenix Suns",
  "LA Clippers",
  "Los Angeles Lakers",
  "Golden State Warriors",
  "Sacramento Kings",
  "New Orleans Pelicans",
  "Houston Rockets",
  "Memphis Grizzlies",
  "San Antonio Spurs",
  "Portland Trail Blazers",
  "Utah Jazz"
];

let east = [...initialEast];
let west = [...initialWest];

function save() {
  localStorage.setItem("nba-east", JSON.stringify(east));
  localStorage.setItem("nba-west", JSON.stringify(west));
}

function load() {
  try {
    const savedEast = JSON.parse(localStorage.getItem("nba-east"));
    const savedWest = JSON.parse(localStorage.getItem("nba-west"));

    if (Array.isArray(savedEast) && savedEast.length === 15) {
      east = savedEast;
    }

    if (Array.isArray(savedWest) && savedWest.length === 15) {
      west = savedWest;
    }
  } catch (error) {
    console.warn("Impossible de charger les pronostics sauvegardés.");
  }
}

function renderList(list, elementId, conference) {
  const container = document.getElementById(elementId);
  container.innerHTML = "";

  list.forEach((team, index) => {
    const row = document.createElement("div");
    row.className = "team";
    row.draggable = true;
    row.dataset.index = index;
    row.dataset.conference = conference;

    row.innerHTML = `
      <span class="position">${index + 1}</span>
      <span class="team-name"></span>
      <span class="handle">☰</span>
      <span class="move">
        <button type="button" class="up" aria-label="Monter">↑</button>
        <button type="button" class="down" aria-label="Descendre">↓</button>
      </span>
    `;

    row.querySelector(".team-name").textContent = team;

    row.querySelector(".up").addEventListener("click", () => {
      moveTeam(conference, index, index - 1);
    });

    row.querySelector(".down").addEventListener("click", () => {
      moveTeam(conference, index, index + 1);
    });

    row.addEventListener("dragstart", () => {
      row.classList.add("dragging");
    });

    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
    });

    row.addEventListener("dragover", event => {
      event.preventDefault();
    });

    row.addEventListener("drop", event => {
      event.preventDefault();

      const source = document.querySelector(".team.dragging");
      if (!source) return;

      const sourceConference = source.dataset.conference;
      const sourceIndex = Number(source.dataset.index);

      if (sourceConference !== conference) return;

      moveTeam(conference, sourceIndex, index);
    });

    container.appendChild(row);
  });
}

function moveTeam(conference, from, to) {
  const list = conference === "east" ? east : west;

  if (to < 0 || to >= list.length || from === to) return;

  const [team] = list.splice(from, 1);
  list.splice(to, 0, team);

  save();
  render();
}

function render() {
  renderList(east, "east-list", "east");
  renderList(west, "west-list", "west");
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Veux-tu vraiment réinitialiser tes pronostics ?")) return;

  east = [...initialEast];
  west = [...initialWest];

  save();
  render();
});

document.getElementById("export").addEventListener("click", () => {
  const content =
    "MON PRONOSTIC NBA\n\n" +
    "CONFÉRENCE EST\n" +
    east.map((team, i) => `${i + 1}. ${team}`).join("\n") +
    "\n\nCONFÉRENCE OUEST\n" +
    west.map((team, i) => `${i + 1}. ${team}`).join("\n");

  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "mon-pronostic-nba.txt";
  link.click();

  URL.revokeObjectURL(url);
});

load();
render();
</script>

</body>
</html>
