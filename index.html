
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon Pronostic NBA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aab5c5;
  margin-bottom: 25px;
}

.conferences {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  max-width: 1150px;
  margin: auto;
}

.conference {
  background: #1c293b;
  border-radius: 14px;
  padding: 16px;
  min-width: 0;
}

.conference h2 {
  text-align: center;
  padding: 14px;
  margin: 0 0 16px;
  border-radius: 9px;
  font-size: 19px;
}

.east h2 {
  background: #1769aa;
}

.west h2 {
  background: #c43d43;
}

/* LÉGENDE */

.legend {
  max-width: 1150px;
  margin: 0 auto 22px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #c1cada;
  font-size: 12px;
}

.legend-color {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

.direct-color {
  background: #16845d;
}

.playin-color {
  background: #c68b28;
}

.out-color {
  background: #43546c;
}

/* ÉQUIPES */

.team-list {
  min-height: 40px;
}

.team {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #29384d;
  margin-bottom: 8px;
  padding: 12px 9px;
  border-radius: 9px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  position: relative;
  transition: background 0.15s;
}

.team:active {
  cursor: grabbing;
}

.team.dragging {
  opacity: 0.4;
  background: #506782;
  border: 2px dashed #64c7ff;
  pointer-events: none;
}

/* QUALIFICATION DIRECTE */

.team.direct {
  border-left: 4px solid #16845d;
}

/* ZONE PLAY-IN : PLACES 7 À 10 */

.team.playin {
  background: #403822;
  border-left: 4px solid #e4a52c;
}

.team.playin-start {
  margin-top: 34px;
  border-top: 2px dashed #e4a52c;
}

.team.playin-start::before {
  content: "ZONE PLAY-IN • PLACES 7 À 10";
  position: absolute;
  top: -27px;
  left: 4px;
  color: #f3bf58;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.team.playin-end {
  margin-bottom: 36px;
  border-bottom: 2px dashed #e4a52c;
}

.team.playin-end::after {
  content: "FIN DE LA ZONE PLAY-IN";
  position: absolute;
  bottom: -25px;
  left: 4px;
  color: #f3bf58;
  font-size: 10px;
  font-weight: bold;
}

/* ÉQUIPES NON QUALIFIÉES */

.team.out {
  border-left: 4px solid #43546c;
}

.position {
  width: 25px;
  flex-shrink: 0;
  color: #c1cada;
  font-weight: bold;
  text-align: center;
}

.team-logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-name {
  flex: 1;
  font-size: 14px;
  font-weight: bold;
  min-width: 0;
}

.handle {
  color: #aab5c5;
  font-size: 21px;
  padding: 0 4px;
}

.move {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.move button {
  border: 0;
  border-radius: 5px;
  background: #43546c;
  color: white;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 16px;
}

.move button:hover {
  background: #607794;
}

/* BOUTONS */

.actions {
  text-align: center;
  margin: 28px 0;
}

.actions button {
  padding: 12px 18px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}

#reset {
  background: #43546c;
  color: white;
}

#export {
  background: #16845d;
  color: white;
}

.hint {
  text-align: center;
  color: #aab5c5;
  font-size: 13px;
  margin-top: 22px;
}

@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 25px;
  }

  .conferences {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .conference {
    padding: 12px;
  }

  .team {
    padding: 12px 7px;
    gap: 7px;
  }

  .team-name {
    font-size: 13px;
  }

  .team-logo {
    width: 30px;
    height: 30px;
  }

  .move button {
    padding: 6px 8px;
  }
}
</style>
</head>

<body>

<h1>🏀 Mon Pronostic NBA</h1>

<p class="subtitle">
  Organise ton classement NBA comme tu le souhaites
</p>

<div class="legend">
  <div class="legend-item">
    <span class="legend-color direct-color"></span>
    Places 1 à 6 : Playoffs
  </div>

  <div class="legend-item">
    <span class="legend-color playin-color"></span>
    Places 7 à 10 : Play-in
  </div>

  <div class="legend-item">
    <span class="legend-color out-color"></span>
    Places 11 à 15 : Éliminées
  </div>
</div>

<div class="conferences">

  <section class="conference east">
    <h2>CONFÉRENCE EST</h2>
    <div id="east-list" class="team-list"></div>
  </section>

  <section class="conference west">
    <h2>CONFÉRENCE OUEST</h2>
    <div id="west-list" class="team-list"></div>
  </section>

</div>

<p class="hint">
  ☝️ Maintiens une équipe et fais-la glisser pour changer sa position.
</p>

<div class="actions">
  <button id="reset">↻ Réinitialiser</button>
  <button id="export">↓ Exporter mes pronostics</button>
</div>

<script>

// ÉQUIPES DE LA CONFÉRENCE EST

const initialEast = [
  "Boston Celtics",
  "New York Knicks",
  "Milwaukee Bucks",
  "Cleveland Cavaliers",
  "Indiana Pacers",
  "Philadelphia 76ers",
  "Miami Heat",
  "Orlando Magic",
  "Atlanta Hawks",
  "Chicago Bulls",
  "Brooklyn Nets",
  "Toronto Raptors",
  "Charlotte Hornets",
  "Washington Wizards",
  "Detroit Pistons"
];

// ÉQUIPES DE LA CONFÉRENCE OUEST

const initialWest = [
  "Oklahoma City Thunder",
  "Denver Nuggets",
  "Minnesota Timberwolves",
  "Dallas Mavericks",
  "Phoenix Suns",
  "LA Clippers",
  "Los Angeles Lakers",
  "Golden State Warriors",
  "Sacramento Kings",
  "New Orleans Pelicans",
  "Houston Rockets",
  "Memphis Grizzlies",
  "San Antonio Spurs",
  "Portland Trail Blazers",
  "Utah Jazz"
];

// LOGOS DES ÉQUIPES

const teamLogos = {
  "Atlanta Hawks": "atl",
  "Boston Celtics": "bos",
  "Brooklyn Nets": "bkn",
  "Charlotte Hornets": "cha",
  "Chicago Bulls": "chi",
  "Cleveland Cavaliers": "cle",
  "Dallas Mavericks": "dal",
  "Denver Nuggets": "den",
  "Detroit Pistons": "det",
  "Golden State Warriors": "gs",
  "Houston Rockets": "hou",
  "Indiana Pacers": "ind",
  "LA Clippers": "lac",
  "Los Angeles Lakers": "lal",
  "Memphis Grizzlies": "mem",
  "Miami Heat": "mia",
  "Milwaukee Bucks": "mil",
  "Minnesota Timberwolves": "min",
  "New Orleans Pelicans": "no",
  "New York Knicks": "ny",
  "Oklahoma City Thunder": "okc",
  "Orlando Magic": "orl",
  "Philadelphia 76ers": "phi",
  "Phoenix Suns": "phx",
  "Portland Trail Blazers": "por",
  "Sacramento Kings": "sac",
  "San Antonio Spurs": "sa",
  "Toronto Raptors": "tor",
  "Utah Jazz": "utah",
  "Washington Wizards": "wsh"
};

// CLASSEMENTS

let east = [...initialEast];
let west = [...initialWest];

let activeTeam = null;
let activeConference = null;
let activePointerId = null;
let moved = false;

// SAUVEGARDE

function save() {
  localStorage.setItem("nba-east", JSON.stringify(east));
  localStorage.setItem("nba-west", JSON.stringify(west));
}

// CHARGEMENT

function load() {
  try {
    const savedEast = JSON.parse(localStorage.getItem("nba-east"));
    const savedWest = JSON.parse(localStorage.getItem("nba-west"));

    if (
      Array.isArray(savedEast) &&
      savedEast.length === 15 &&
      initialEast.every(team => savedEast.includes(team))
    ) {
      east = savedEast;
    }

    if (
      Array.isArray(savedWest) &&
      savedWest.length === 15 &&
      initialWest.every(team => savedWest.includes(team))
    ) {
      west = savedWest;
    }

  } catch (error) {
    console.log("Chargement impossible.");
  }
}

// AFFICHAGE DES ÉQUIPES

function renderList(list, id, conference) {
  const container = document.getElementById(id);
  container.innerHTML = "";

  list.forEach((team, index) => {

    const position = index + 1;

    const row = document.createElement("div");

    row.className = "team";

    if (position <= 6) {
      row.classList.add("direct");
    } else if (position <= 10) {
      row.classList.add("playin");

      if (position === 7) {
        row.classList.add("playin-start");
      }

      if (position === 10) {
        row.classList.add("playin-end");
      }
    } else {
      row.classList.add("out");
    }

    row.dataset.conference = conference;

    const logoCode = teamLogos[team];

    row.innerHTML = `
      <span class="position">${position}</span>

      <img
        class="team-logo"
        src="https://a.espncdn.com/i/teamlogos/nba/500/${logoCode}.png"
        alt="Logo ${team}"
        draggable="false"
        onerror="this.style.visibility='hidden'"
      >

      <span class="team-name"></span>

      <span class="handle">☰</span>

      <span class="move">
        <button type="button" class="up" aria-label="Monter">↑</button>
        <button type="button" class="down" aria-label="Descendre">↓</button>
      </span>
    `;

    row.querySelector(".team-name").textContent = team;

    row.querySelector(".up").addEventListener("click", () => {
      moveTeam(conference, index, index - 1);
    });

    row.querySelector(".down").addEventListener("click", () => {
      moveTeam(conference, index, index + 1);
    });

    row.addEventListener("pointerdown", startDrag);

    container.appendChild(row);
  });
}

function render() {
  renderList(east, "east-list", "east");
  renderList(west, "west-list", "west");
}

// DÉPLACEMENT AVEC LES FLÈCHES

function moveTeam(conference, from, to) {
  const list = conference === "east" ? east : west;

  if (to < 0 || to >= list.length || from === to) {
    return;
  }

  const team = list.splice(from, 1)[0];
  list.splice(to, 0, team);

  save();
  render();
}

// DÉBUT DU GLISSER-DÉPOSER

function startDrag(event) {
  if (event.target.closest("button")) return;
  if (!event.isPrimary) return;

  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }

  activeTeam = event.currentTarget;
  activeConference = activeTeam.dataset.conference;
  activePointerId = event.pointerId;
  moved = false;

  event.preventDefault();

  activeTeam.classList.add("dragging");
}

// DÉPLACEMENT À LA SOURIS OU AU DOIGT

document.addEventListener("pointermove", event => {

  if (!activeTeam) return;
  if (event.pointerId !== activePointerId) return;

  event.preventDefault();

  const targetElement = document.elementFromPoint(
    event.clientX,
    event.clientY
  );

  if (!targetElement) return;

  const target = targetElement.closest(".team");

  if (!target || target === activeTeam) return;

  if (target.dataset.conference !== activeConference) {
    return;
  }

  moved = true;

  const rect = target.getBoundingClientRect();
  const middle = rect.top + rect.height / 2;

  const list = target.parentElement;

  if (event.clientY < middle) {
    list.insertBefore(activeTeam, target);
  } else {
    list.insertBefore(activeTeam, target.nextSibling);
  }

}, { passive: false });

// FIN DU DÉPLACEMENT

function finishDrag(event) {

  if (!activeTeam) return;
  if (event.pointerId !== activePointerId) return;

  const conference = activeConference;

  activeTeam.classList.remove("dragging");

  if (moved) {

    const container = document.getElementById(
      conference + "-list"
    );

    const newOrder = [
      ...container.querySelectorAll(".team")
    ].map(row => {
      return row.querySelector(".team-name").textContent;
    });

    if (conference === "east") {
      east = newOrder;
    } else {
      west = newOrder;
    }

    save();
  }

  activeTeam = null;
  activeConference = null;
  activePointerId = null;
  moved = false;

  render();
}

document.addEventListener("pointerup", finishDrag);
document.addEventListener("pointercancel", finishDrag);

// RÉINITIALISATION

document.getElementById("reset").addEventListener("click", () => {

  if (!confirm("Veux-tu réinitialiser les deux classements ?")) {
    return;
  }

  east = [...initialEast];
  west = [...initialWest];

  save();
  render();
});

// EXPORT DES PRONOSTICS

document.getElementById("export").addEventListener("click", () => {

  const content =
    "MON PRONOSTIC NBA\n\n" +
    "CONFÉRENCE EST\n" +
    east.map((team, i) => `${i + 1}. ${team}`).join("\n") +
    "\n\nCONFÉRENCE OUEST\n" +
    west.map((team, i) => `${i + 1}. ${team}`).join("\n");

  const blob = new Blob([content], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "mon-pronostic-nba.txt";

  link.click();

  URL.revokeObjectURL(url);
});

// LANCEMENT

load();
render();

</script>

</body>
</html>
